<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Field Test: rice bran wax and lauric acid PCM for solar panel cooling">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#1d3557"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3987e5"/>
      <stop offset="1" stop-color="#1e4f91"/>
    </linearGradient>
    <linearGradient id="pcm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eb6834"/>
      <stop offset="1" stop-color="#eda100"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="1060" cy="70" r="110" fill="url(#glow)"/>
  <circle cx="1060" cy="70" r="34" fill="#ffd166"/>
  <g stroke="#ffd166" stroke-width="5" stroke-linecap="round">
    <line x1="1060" y1="14" x2="1060" y2="0"/>
    <line x1="1004" y1="70" x2="988" y2="70"/>
    <line x1="1020" y1="30" x2="1009" y2="19"/>
    <line x1="1020" y1="110" x2="1009" y2="121"/>
    <line x1="1100" y1="110" x2="1111" y2="121"/>
    <line x1="1116" y1="70" x2="1132" y2="70"/>
  </g>
  <!-- rays to panel -->
  <g stroke="#ffd166" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 8">
    <line x1="1030" y1="100" x2="900" y2="180"/>
    <line x1="1045" y1="110" x2="960" y2="200"/>
  </g>

  <!-- tilted panel with PCM pack behind -->
  <g transform="translate(830 150) skewX(-18)">
    <rect x="18" y="58" width="150" height="16" rx="3" fill="url(#pcm)"/>
    <rect x="0" y="0" width="190" height="64" rx="5" fill="url(#cell)" stroke="#9fc3f0" stroke-width="2"/>
    <g stroke="#9fc3f0" stroke-opacity="0.6" stroke-width="1.5">
      <line x1="47" y1="0" x2="47" y2="64"/>
      <line x1="95" y1="0" x2="95" y2="64"/>
      <line x1="142" y1="0" x2="142" y2="64"/>
      <line x1="0" y1="32" x2="190" y2="32"/>
    </g>
  </g>
  <line x1="880" y1="232" x2="870" y2="270" stroke="#9aa5b1" stroke-width="5" stroke-linecap="round"/>
  <line x1="1010" y1="232" x2="1020" y2="270" stroke="#9aa5b1" stroke-width="5" stroke-linecap="round"/>
  <text x="935" y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c3c2b7" text-anchor="middle">PCM pack on the panel back</text>

  <!-- title -->
  <text x="60" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Field Test</text>
  <text x="62" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#d6dde6">Rice bran wax + lauric acid phase-change material</text>
  <text x="62" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#d6dde6">for passive cooling of solar panels</text>

  <!-- chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="62" y="214" width="176" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="150" y="236" fill="#ffffff" text-anchor="middle">4 DS18B20 sensors</text>
    <rect x="250" y="214" width="176" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="338" y="236" fill="#ffffff" text-anchor="middle">4-panel crossover</text>
    <rect x="438" y="214" width="166" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="521" y="236" fill="#ffffff" text-anchor="middle">Arduino + Python</text>
  </g>
</svg>
